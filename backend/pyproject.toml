[project]
name = "suurennuslasi-backend"
requires-python = ">=3.12,<4"
dynamic = [ "dependencies" ]

[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<4"
suurennuslasi-db = { path = "packages/db", develop = true }
suurennuslasi-domain = { path = "packages/domain", develop = true }
suurennuslasi-events = { path = "packages/events", develop = true }
suurennuslasi-messaging = { path = "packages/messaging", develop = true }
suurennuslasi-storage = { path = "packages/storage", develop = true }
suurennuslasi-api = { path = "services/api", develop = true }
suurennuslasi-geoparser = { path = "services/geoparser", develop = true }
suurennuslasi-importer = { path = "services/importer", develop = true }

[tool.poetry.group.dev.dependencies]
black = "^26.5.1"
isort = "^8.0.1"
pytest = "^9.0.3"
watchfiles = "^1.2.0"


[tool.black]
target-version = ["py312"]


[tool.isort]
profile = "black"
sections = [
    "FUTURE",
    "STDLIB",
    "THIRDPARTY",
    "SERVICES",
    "PACKAGES",
    "FIRSTPARTY",
    "LOCALFOLDER",
]
known_services = [
    "suurennuslasi_api",
    "suurennuslasi_geoparser",
    "suurennuslasi_importer",
]
known_packages = [
    "suurennuslasi_db",
    "suurennuslasi_domain",
    "suurennuslasi_events",
    "suurennuslasi_messaging",
    "suurennuslasi_storage",
]
