[project]
name = "suurennuslasi-geoparser"
version = "0.1.0"
description = ""
authors = [
    {name = "nicolasspring",email = "springn.ch@gmail.com"}
]
requires-python = ">=3.12,<4"
dynamic = [ "dependencies" ]

[tool.poetry.dependencies]
suurennuslasi-db = { path = "../../packages/db", develop = true }
