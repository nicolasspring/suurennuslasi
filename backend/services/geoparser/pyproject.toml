suurennuslasi-events = { path = "../../packages/events", develop = true }
suurennuslasi-messaging = { path = "../../packages/messaging", develop = true }

[tool.poetry.group.dev.dependencies]
black = "^26.5.1"
isort = "^8.0.1"
pytest = "^9.0.3"
watchfiles = "^1.2.0"
en-core-web-sm = {url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0.tar.gz"}
