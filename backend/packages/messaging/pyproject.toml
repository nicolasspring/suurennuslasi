[project]
name = "suurennuslasi-messaging"
version = "0.1.0"
description = ""
authors = [
    {name = "nicolasspring",email = "springn.ch@gmail.com"}
]
requires-python = ">=3.12,<4"
dynamic = [ "dependencies" ]

[tool.poetry.dependencies]
aio-pika = "^9.6.2"

[tool.poetry.group.dev.dependencies]
black = "^26.5.1"
isort = "^8.0.1"
pytest = "^9.0.3"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.isort]
profile = "black"
sections = [
    "FUTURE",
    "STDLIB",
    "THIRDPARTY",
    "SERVICES",
    "PACKAGES",
    "FIRSTPARTY",
    "LOCALFOLDER",
]
known_services = [
    "suurennuslasi_api",
    "suurennuslasi_importer",
]
known_packages = [
    "suurennuslasi_db",
    "suurennuslasi_domain",
    "suurennuslasi_events",
    "suurennuslasi_messaging",
    "suurennuslasi_storage",
]
