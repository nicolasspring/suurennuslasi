[project]
name = "suurennuslasi-domain"
version = "0.1.0"
description = ""
authors = [
    {name = "nicolasspring",email = "springn.ch@gmail.com"}
]
requires-python = ">=3.12"
dependencies = [
]

[tool.poetry.group.dev.dependencies]
black = "^26.5.1"
isort = "^8.0.1"
