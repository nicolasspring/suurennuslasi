services:
  frontend:
    build:
      context: ./frontend
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - api

  api:
    build:
      context: ./backend
      dockerfile: services/api/Dockerfile
    working_dir: /app/services/api
    command: python -m uvicorn suurennuslasi_api.app:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy

  importer:
    build:
      context: ./backend
      dockerfile: services/importer/Dockerfile
    working_dir: /app/services/importer
    command: >
      watchfiles
      --filter python
      "python -m suurennuslasi_importer.main"
      /app
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    depends_on:
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started
      db:
        condition: service_healthy

  geoparser:
    build:
      context: ./backend
      dockerfile: services/geoparser/Dockerfile
    working_dir: /app/services/geoparser
    command: >
      watchfiles
      --filter python
      "python -m suurennuslasi_geoparser.main"
      /app
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    depends_on:
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started
      db:
        condition: service_healthy

  db:
    image: postgis/postgis
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: suurennuslasi
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d suurennuslasi"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server --console-address ":9001" /data

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  minio_data:
  postgres_data:
